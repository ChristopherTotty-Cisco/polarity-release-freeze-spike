name: Synthetic status source proof
on:
  workflow_dispatch:
    inputs:
      target_sha:
        type: string
        required: true
      target_context:
        type: string
        required: true
permissions:
  statuses: write
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ inputs.target_sha }}
      TARGET_CONTEXT: ${{ inputs.target_context }}
    steps:
      - name: Deliberately write matching status using the wrong integration
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$TARGET_CONTEXT" =~ ^release-window-status-[0-9]+-[0-9]+$ ]]
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -f state=success -f "context=$TARGET_CONTEXT" \
            -f description='Synthetic GITHUB_TOKEN source-forgery probe' \
            --jq '{id,state,context,creator:.creator.login}'
